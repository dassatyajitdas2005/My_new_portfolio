      <stop offset="0%" stop-color="#120e17" />
      <stop offset="50%" stop-color="#1d1424" />
      <stop offset="100%" stop-color="#0a080d" />
    </linearGradient>
    <pattern id="gridB" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2b1e36" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradB)" />
