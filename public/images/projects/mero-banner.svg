      <!-- Capability Feature Pills -->
      <g transform="translate(0, 268)">
        <rect width="320" height="196" rx="18" fill="url(#cardGradDark)" stroke="#262936" stroke-width="1" />

        <text x="20" y="30" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
