      <!-- Bottom Card: Founder & Product Building Banner -->
      <g transform="translate(22, 362)">
        <rect width="432" height="88" rx="14" fill="#191b24" stroke="#282c3c" stroke-width="1" />
        
        <!-- Founder Badge -->
        <g transform="translate(16, 16)">
          <rect width="36" height="36" rx="10" fill="url(#goldAccentGrad)" />
          <text x="18" y="24" fill="#13141a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">SD</text>
          
          <g transform="translate(48, 6)">
            <text x="0" y="12" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">
