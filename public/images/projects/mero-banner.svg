        <!-- Item 1 -->
        <g transform="translate(20, 48)">
          <circle cx="6" cy="8" r="4" fill="#f97316" />
          <text x="18" y="12" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
            Modern Websites &amp; Landing Pages
          </text>
        </g>

        <!-- Item 2 -->
        <g transform="translate(20, 82)">
          <circle cx="6" cy="8" r="4" fill="#facc15" />
          <text x="18" y="12" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
            Inventory Management Systems
          </text>
        </g>

        <!-- Item 3 -->
        <g transform="translate(20, 116)">
          <circle cx="6" cy="8" r="4" fill="#f97316" />
          <text x="18" y="12" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
            CRM &amp; Customer Management
          </text>
        </g>

        <!-- Item 4 -->
        <g transform="translate(20, 150)">
          <circle cx="6" cy="8" r="4" fill="#facc15" />
          <text x="18" y="12" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
            Custom Software &amp; Portfolios
          </text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: Dashboard & Product Mockup Composition -->
    <g transform="translate(500, 136)">
      <!-- Main Dashboard Card -->
      <rect width="476" height="468" rx="20" fill="url(#cardGradElevated)" stroke="#2b2f3e" stroke-width="1.5" />

      <!-- Dashboard Header -->
      <g transform="translate(22, 22)">
        <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">
          MERO Operations &amp; Solutions Hub
        </text>
        <text x="0" y="32" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
          Real-time CRM, Inventory &amp; Web Engine
        </text>

        <!-- Live Status Pill -->
        <g transform="translate(330, 2)">
          <rect width="102" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
          <circle cx="12" cy="12" r="3.5" fill="#10b981" />
          <text x="22" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">
            LIVE SYSTEM
          </text>
        </g>
      </g>

      <!-- Mini KPI Metrics Row -->
      <g transform="translate(22, 70)">
        <!-- Metric 1: Custom Software -->
        <g>
          <rect width="136" height="74" rx="12" fill="#181a22" stroke="#252835" stroke-width="1" />
          <text x="12" y="22" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">INVENTORY TRACK</text>
          <text x="12" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">100%</text>
          <text x="12" y="64" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Sync Precision</text>
        </g>

        <!-- Metric 2: CRM & Leads -->
        <g transform="translate(148, 0)">
          <rect width="136" height="74" rx="12" fill="#181a22" stroke="#252835" stroke-width="1" />
          <text x="12" y="22" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">CRM WORKFLOWS</text>
          <text x="12" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Automated</text>
          <text x="12" y="64" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Zero Latency</text>
        </g>

        <!-- Metric 3: Digital Growth -->
        <g transform="translate(296, 0)">
          <rect width="136" height="74" rx="12" fill="#181a22" stroke="#252835" stroke-width="1" />
          <text x="12" y="22" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">WEB EXPERIENCES</text>
          <text x="12" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Bespoke</text>
          <text x="12" y="64" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600">Modern UX</text>
        </g>
      </g>

      <!-- Interactive Data / Solutions Table View -->
      <g transform="translate(22, 160)">
        <rect width="432" height="186" rx="14" fill="#161820" stroke="#232633" stroke-width="1" />

        <!-- Table Header -->
        <g transform="translate(16, 18)">
          <text x="0" y="0" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">SERVICE MODULE</text>
          <text x="180" y="0" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">TECH STACK</text>
          <text x="320" y="0" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">DELIVERY</text>
        </g>
        <line x1="16" y1="28" x2="416" y2="28" stroke="#242735" stroke-width="1" />

        <!-- Row 1 -->
        <g transform="translate(16, 48)">
          <text x="0" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Modern Web &amp; Apps</text>
          <text x="180" y="10" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Next.js · Tailwind</text>
          <rect x="320" y="-3" width="76" height="18" rx="9" fill="#f97316" fill-opacity="0.18" />
          <text x="358" y="10" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Production</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(16, 82)">
          <text x="0" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Inventory Solutions</text>
          <text x="180" y="10" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Custom Schemas</text>
          <rect x="320" y="-3" width="76" height="18" rx="9" fill="#10b981" fill-opacity="0.18" />
          <text x="358" y="10" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Automated</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(16, 116)">
          <text x="0" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">CRM &amp; Dashboards</text>
          <text x="180" y="10" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Full-Stack Tools</text>
          <rect x="320" y="-3" width="76" height="18" rx="9" fill="#facc15" fill-opacity="0.18" />
          <text x="358" y="10" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Active</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(16, 150)">
          <text x="0" y="10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Personal Brand Sites</text>
          <text x="180" y="10" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Bespoke Design</text>
          <rect x="320" y="-3" width="76" height="18" rx="9" fill="#f97316" fill-opacity="0.18" />
          <text x="358" y="10" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Polished</text>
        </g>
