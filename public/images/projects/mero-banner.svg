<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="meroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d10" />
      <stop offset="45%" stop-color="#121318" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Warm Brand Gradients: Charcoal, Orange & Golden Yellow -->
    <linearGradient id="meroBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="orangeAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18191f" />
      <stop offset="100%" stop-color="#111216" />
    </linearGradient>

    <linearGradient id="cardGradElevated" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21232b" />
      <stop offset="100%" stop-color="#15161c" />
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="meroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222530" stroke-width="0.75" />
    </pattern>

    <!-- Glass Glow Filter -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#meroBgGrad)" />
  <rect width="1200" height="800" fill="url(#meroGrid)" opacity="0.45" />

  <!-- Ambient Brand Glows -->
  <circle cx="1020" cy="180" r="320" fill="#f97316" opacity="0.14" filter="url(#glowOrange)" />
  <circle cx="180" cy="660" r="280" fill="#facc15" opacity="0.10" filter="url(#glowOrange)" />
  <circle cx="600" cy="400" r="220" fill="#ea580c" opacity="0.06" filter="url(#glowOrange)" />

  <!-- Main Application & Dashboard Shell -->
  <g transform="translate(80, 75)">
    <!-- Browser Window Shadow / Outer Border -->
    <rect width="1040" height="650" rx="26" fill="#13141a" stroke="#262936" stroke-width="2" />

    <!-- Browser Window Chrome Bar -->
    <rect width="1040" height="58" rx="26" fill="#171821" />
    <!-- Fix border radius at bottom corners of bar -->
    <rect y="40" width="1040" height="18" fill="#171821" />
    <line x1="0" y1="58" x2="1040" y2="58" stroke="#262936" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="36" cy="29" r="6.5" fill="#ef4444" opacity="0.85" />
    <circle cx="58" cy="29" r="6.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="80" cy="29" r="6.5" fill="#10b981" opacity="0.85" />

    <!-- URL Bar -->
    <g transform="translate(300, 13)">
      <rect width="440" height="32" rx="16" fill="#0f1015" stroke="#242735" stroke-width="1" />
      <!-- Lock Icon -->
      <path d="M 18 17 V 14 A 4 4 0 0 1 26 14 V 17 M 15 17 H 29 A 2 2 0 0 1 31 19 V 24 A 2 2 0 0 1 29 26 H 15 A 2 2 0 0 1 13 24 V 19 A 2 2 0 0 1 15 17 Z" fill="none" stroke="#facc15" stroke-width="1.5" />
      <text x="40" y="21" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        https://m4mero.vercel.app
      </text>
      <circle cx="418" cy="16" r="3.5" fill="#10b981" />
    </g>

    <!-- Top In-App Brand Nav -->
    <g transform="translate(32, 76)">
      <!-- MERO Brand Emblem -->
      <rect width="36" height="36" rx="10" fill="url(#orangeAccentGrad)" />
      <!-- Stylized M Glyph -->
      <path d="M 10 27 V 11 L 18 20 L 26 11 V 27" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

      <text x="46" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
        MERO
      </text>

      <rect x="116" y="7" width="138" height="22" rx="11" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4" stroke-width="1" />
      <text x="185" y="22" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">
        DIGITAL SOLUTIONS
      </text>

      <!-- Nav Links -->
      <g transform="translate(620, 8)">
        <text x="0" y="15" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Home</text>
        <text x="65" y="15" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Services</text>
        <text x="145" y="15" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Solutions</text>
        <text x="235" y="15" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Contact</text>
      </g>
    </g>

    <!-- Main Content Area: Left Showcase + Right Dashboard Composition -->
    
    <!-- LEFT COLUMN: Hero Presentation -->
    <g transform="translate(32, 136)">
      <!-- Badge Pill -->
      <rect width="180" height="26" rx="13" fill="#facc15" fill-opacity="0.12" stroke="#facc15" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="14" cy="13" r="3.5" fill="#facc15" />
      <text x="24" y="17" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">
        STARTUP ECOSYSTEM
      </text>

      <!-- Hero Headline -->
      <text x="0" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
        Turning Ideas into
      </text>
      <text x="0" y="108" fill="url(#meroBrandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
        Practical Digital Systems.
      </text>

      <!-- Subtext -->
      <text x="0" y="146" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
        Bespoke web platforms, custom inventory trackers,
      </text>
      <text x="0" y="168" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
        CRM architectures, and professional digital identity.
      </text>

      <!-- CTA Buttons -->
      <g transform="translate(0, 196)">
        <!-- Primary Action Button -->
        <rect width="156" height="42" rx="12" fill="url(#orangeAccentGrad)" />
        <text x="78" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
          Live Platform ↗
        </text>

        <!-- Secondary Outline Button -->
        <rect x="168" width="138" height="42" rx="12" fill="#1b1c24" stroke="#2e3242" stroke-width="1" />
        <text x="237" y="26" fill="#d1d5db" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
          Explore Builds
        </text>
