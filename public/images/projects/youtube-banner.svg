      <text x="30" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">Tech IT &amp; Career Guidance Channels</text>

      <g transform="translate(0, 150)">
        <rect width="380" height="260" rx="16" fill="#291515" stroke="#452222" stroke-width="1" />
        <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Tech IT Tutorials</text>
        <line x1="25" y1="65" x2="355" y2="65" stroke="#3d1d1d" stroke-width="1" />
        <text x="25" y="105" fill="#ba9595" font-family="-apple-system, sans-serif" font-size="13">✦ Programming &amp; Tech Fundamentals</text>
        <text x="25" y="145" fill="#ba9595" font-family="-apple-system, sans-serif" font-size="13">✦ Software Development Overviews</text>
        <text x="25" y="185" fill="#ba9595" font-family="-apple-system, sans-serif" font-size="13">✦ Engaging Motion &amp; Screen Recordings</text>
        <text x="25" y="225" fill="#B5FF6D" font-family="-apple-system, sans-serif" font-size="13">✦ 1+ Year Continuous Publishing</text>
      </g>

      <g transform="translate(420, 150)">
        <rect width="380" height="260" rx="16" fill="#291515" stroke="#452222" stroke-width="1" />
        <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Mr. Career Guidance</text>
        <line x1="25" y1="65" x2="355" y2="65" stroke="#3d1d1d" stroke-width="1" />
        <text x="25" y="105" fill="#ba9595" font-family="-apple-system, sans-serif" font-size="13">✦ Career Roadmaps for Students</text>
        <text x="25" y="145" fill="#ba9595" font-family="-apple-system, sans-serif" font-size="13">✦ Skill Acquisition Strategies</text>
        <text x="25" y="185" fill="#ba9595" font-family="-apple-system, sans-serif" font-size="13">✦ High Audience Retention Edits</text>
        <text x="25" y="225" fill="#f87171" font-family="-apple-system, sans-serif" font-size="13">✦ Impactful Educational Media</text>
