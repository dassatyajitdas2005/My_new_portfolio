<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradY" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e0e" />
      <stop offset="50%" stop-color="#241414" />
      <stop offset="100%" stop-color="#0d0707" />
    </linearGradient>
    <pattern id="gridY" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#361f1f" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradY)" />
  <rect width="1200" height="800" fill="url(#gridY)" opacity="0.6" />
  <circle cx="950" cy="300" r="280" fill="#ef4444" opacity="0.12" filter="blur(60px)" />
  <circle cx="250" cy="550" r="240" fill="#f97316" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(150, 120)">
    <rect width="900" height="560" rx="24" fill="#1f1313" stroke="#4a2626" stroke-width="2" />
    <rect width="900" height="55" rx="24" fill="#2c1a1a" />
    <circle cx="40" cy="28" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="62" cy="28" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="84" cy="28" r="6" fill="#10b981" opacity="0.8" />
    <text x="450" y="34" fill="#ba9595" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      Tech IT &amp; Mr. Career — YouTube Educational Content
    </text>

    <!-- Content Mockup -->
    <g transform="translate(50, 90)">
