<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15120e" />
      <stop offset="50%" stop-color="#221b14" />
      <stop offset="100%" stop-color="#0e0c0a" />
    </linearGradient>
    <pattern id="gridN" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2d241c" stroke-width="0.75" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradN)" />
  <rect width="1200" height="800" fill="url(#gridN)" opacity="0.6" />
  <circle cx="950" cy="300" r="280" fill="#f59e0b" opacity="0.1" filter="blur(60px)" />
  <circle cx="250" cy="550" r="240" fill="#B5FF6D" opacity="0.1" filter="blur(50px)" />

  <g transform="translate(150, 120)">
    <rect width="900" height="560" rx="24" fill="#1b1612" stroke="#382e25" stroke-width="2" />
    <rect width="900" height="55" rx="24" fill="#241d18" />
    <circle cx="40" cy="28" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="62" cy="28" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="84" cy="28" r="6" fill="#10b981" opacity="0.8" />
    <text x="450" y="34" fill="#a89a8c" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      NeedMet — Business Data Listing &amp; Video Assets
    </text>

    <!-- Content Mockup -->
    <g transform="translate(50, 90)">
      <rect width="800" height="120" rx="16" fill="#28201a" stroke="#3d3127" stroke-width="1" />
      <text x="30" y="45" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">BUSINESS DATA DIRECTORY</text>
      <text x="30" y="85" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="700">Verified Listing Operations &amp; Marketing</text>

      <!-- Data Stats -->
      <g transform="translate(0, 150)">
        <rect width="250" height="260" rx="16" fill="#241d18" stroke="#382e25" stroke-width="1" />
        <text x="25" y="45" fill="#a89a8c" font-family="-apple-system, sans-serif" font-size="13">DATA INTEGRITY</text>
        <text x="25" y="90" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="36" font-weight="700">99.8%</text>
        <text x="25" y="125" fill="#B5FF6D" font-family="-apple-system, sans-serif" font-size="13">Verified Records</text>
      </g>

      <g transform="translate(275, 150)">
        <rect width="525" height="260" rx="16" fill="#241d18" stroke="#382e25" stroke-width="1" />
        <text x="25" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="600">Enterprise Catalog Processing</text>
        <line x1="25" y1="65" x2="500" y2="65" stroke="#332a22" stroke-width="1" />
        
        <text x="25" y="105" fill="#a89a8c" font-family="-apple-system, sans-serif" font-size="13">✓ Business Entity Verification &amp; Accuracy</text>
        <text x="25" y="145" fill="#a89a8c" font-family="-apple-system, sans-serif" font-size="13">✓ High-Quality Brand Video Production</text>
        <text x="25" y="185" fill="#a89a8c" font-family="-apple-system, sans-serif" font-size="13">✓ SEO Copywriting &amp; Meta Listing Optimization</text>
        <text x="25" y="225" fill="#a89a8c" font-family="-apple-system, sans-serif" font-size="13">✓ Google Sheets Enterprise Data Operations</text>
      </g>
